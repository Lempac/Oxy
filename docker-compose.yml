services:
  app:
    build: .
    image: oxy-app
    ports:
      - "8000:8000"
      - "9000:9000"
    env_file: .env
    volumes:
      - oxy_database:/var/www/database
      - oxy_storage:/var/www/storage/app
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
    restart: unless-stopped

  y-web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "1234:1234"
    command: npx --yes y-websocket@2.1.0
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  oxy_database:
  oxy_storage:
