services:
  app:
    build: .
    image: oxy-app:latest
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.0
    command: --config /etc/livekit.yaml --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-60000:50000-60000/udp"
    restart: unless-stopped

  y-web:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "1234:1234"
    command: npx --yes y-websocket@2.1.0
    restart: unless-stopped

volumes:
  pb_data:
