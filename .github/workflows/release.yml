name: Release and Production Deployment

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version override to deploy (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, pcntl
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate key and routes
        run: |
          php artisan key:generate
          php artisan wayfinder:generate
          pnpm run build
          php artisan storage:link
          chmod -R 777 storage bootstrap/cache
          mkdir -p database
          touch database/database.sqlite

      - name: Execute Backend Tests (Pest/PHPUnit)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Execute Frontend Tests (Vitest)
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
          VITE_REVERB_APP_KEY: 'test-reverb-key'
        run: pnpm run test

  build-and-deploy:
    name: Build & Deploy to Production
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository image name
        id: image-meta
        env:
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REPO_LOWER=$(echo "${GH_REPO}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-meta.outputs.image }}
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH Agent for Uncloud
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UNCLOUD_SSH_KEY }}
          log-public-key: false

      - name: Install Uncloud CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNCLOUD_VERSION: ${{ vars.UNCLOUD_VERSION || 'v0.20.0' }}
        run: |
          LATEST_UC=$(gh release view --repo psviderski/uncloud --json tagName -q .tagName 2>/dev/null || echo "")
          if [ -n "${LATEST_UC}" ] && [ "${LATEST_UC}" != "${UNCLOUD_VERSION}" ]; then
            echo "::warning title=Newer Uncloud Version Available::A newer upstream Uncloud version (${LATEST_UC}) is available. Current workflow uses ${UNCLOUD_VERSION}."
          fi

          gh release download "${UNCLOUD_VERSION}" --repo psviderski/uncloud --pattern "uc_linux_amd64.tar.gz" --pattern "checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf uc_linux_amd64.tar.gz
          sudo install -m 755 uc /usr/local/bin/uc
          rm -f uc uc_linux_amd64.tar.gz checksums.txt

      - name: Ensure Production S3 Bucket Exists
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET || 'oxy' }}
        run: |
          aws s3api create-bucket \
            --bucket "${AWS_BUCKET}" \
            --endpoint-url "https://void.lempac.dev" || true

      - name: Deploy Production to Uncloud
        env:
          UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
          OXY_IMAGE: ${{ steps.image-meta.outputs.full_image }}
          OXY_DOMAIN: ${{ vars.OXY_DOMAIN || 'oxy.lempac.dev' }}
          OXY_WS_DOMAIN: ${{ vars.OXY_WS_DOMAIN || 'ws.oxy.lempac.dev' }}
          OXY_YJS_DOMAIN: ${{ vars.OXY_YJS_DOMAIN || 'yjs.oxy.lempac.dev' }}
        run: |
          export OXY_IMAGE OXY_DOMAIN OXY_WS_DOMAIN OXY_YJS_DOMAIN
          uc deploy -f compose.uncloud.yaml -y --connect "${UNCLOUD_CONNECT}"

      - name: Verify Uncloud Services
        env:
          UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
        run: |
          uc ps --connect "${UNCLOUD_CONNECT}"
