# Uncloud-compatible Compose file for Oxy (PocketBase + LiveKit + Vue SPA + Yjs)
# ─────────────────────────────────────────────────────────────────────
# Deploy with:
#   uc deploy -f compose.uncloud.yaml
#
# Required env vars:
#   OXY_DOMAIN          – PocketBase & Web App domain (e.g. oxy.example.com)
#   OXY_LIVEKIT_DOMAIN  – LiveKit SFU domain          (e.g. livekit.example.com)
#   OXY_YJS_DOMAIN      – Yjs whiteboard domain       (e.g. yjs.example.com)
# ─────────────────────────────────────────────────────────────────────

services:
  oxy-app:
    image: ${OXY_IMAGE:-ghcr.io/lempac/oxy:latest}
    pull_policy: always
    build: .
    environment:
      VITE_POCKETBASE_URL: https://${OXY_DOMAIN:-oxy.example.com}
      VITE_LIVEKIT_URL: wss://${OXY_LIVEKIT_DOMAIN:-livekit.example.com}
      VITE_YJS_WS_URL: wss://${OXY_YJS_DOMAIN:-yjs.example.com}
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}"
    volumes:
      - oxy-pb-data:/pb/pb_data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
    x-ports:
      - ${OXY_DOMAIN:-oxy.example.com}:8090/https

  oxy-livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secretsecretsecretsecretsecretsecret}"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    x-ports:
      - ${OXY_LIVEKIT_DOMAIN:-livekit.example.com}:7880/https

  oxy-yjs:
    image: node:24-alpine
    working_dir: /app
    command: npx --yes y-websocket@2.1.0
    environment:
      HOST: "0.0.0.0"
      PORT: "1234"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    x-ports:
      - ${OXY_YJS_DOMAIN:-yjs.example.com}:1234/https

volumes:
  oxy-pb-data:
